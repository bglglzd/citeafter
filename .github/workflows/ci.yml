name: Check package
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned build and check tools
        run: python -m pip install -r requirements-dev.txt
      - name: Domain, transport and artifact boundaries
        run: python -B -m unittest discover -s tests -v
      - name: Python static checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Browser JavaScript syntax
        shell: bash
        run: |
          if [ -f citeafter/assets/app.js ]; then node --check citeafter/assets/app.js; fi
      - name: Build packages
        run: python -m build --no-isolation --outdir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citeafter-${{ matrix.os }}-python${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
