[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citeafter"
version = "0.1.0"
description = "Versioned evidence impact analysis and temporal action gates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Citeafter contributors"}]
dependencies = []

[project.scripts]
citeafter = "citeafter.cli:main"

[tool.setuptools.packages.find]
include = ["citeafter*"]

[tool.setuptools.package-data]
citeafter = ["assets/*", "examples/policies/*.json", "examples/development/*.json"]
